<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produktový katalog DigiDay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f3f5;
    display: flex;
    flex-direction: column;
  }
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 12px 4px;
  }
  #book { width: 100%; height: 100%; }
  #book .page {
    background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  #book .page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  #toolbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 12px;
  }
  #toolbar button {
    border: 1px solid #d0d3d8;
    background: #fff;
    color: #333;
    border-radius: 8px;
    min-width: 40px;
    height: 34px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s;
  }
  #toolbar button:hover { background: #e8eaee; }
  #toolbar button:disabled { opacity: .35; cursor: default; }
  #counter {
    font-size: 13px;
    color: #555;
    min-width: 64px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    background: #f2f3f5;
    z-index: 5;
  }
  @media (prefers-color-scheme: dark) {
    body, #loading { background: #17181c; }
    #toolbar button { background: #24262c; border-color: #383b42; color: #ddd; }
    #toolbar button:hover { background: #2e3138; }
    #counter { color: #aaa; }
  }
</style>
</head>
<body>
  <div id="loading">Načítám katalog…</div>
  <div id="stage"><div id="book"></div></div>
  <div id="toolbar">
    <button id="prev" title="Předchozí strana" aria-label="Předchozí strana">‹</button>
    <span id="counter">–</span>
    <button id="next" title="Další strana" aria-label="Další strana">›</button>
    <button id="fs" title="Celá obrazovka" aria-label="Celá obrazovka">⛶</button>
  </div>

<script src="page-flip.browser.js"></script>
<script>
(function () {
  var PAGE_COUNT = 36;
  var pages = [];
  for (var i = 1; i <= PAGE_COUNT; i++) {
    pages.push("pages/page-" + String(i).padStart(2, "0") + ".jpg");
  }

  var pageFlip = new St.PageFlip(document.getElementById("book"), {
    width: 910,
    height: 1287,
    size: "stretch",
    minWidth: 220,
    maxWidth: 1100,
    minHeight: 300,
    maxHeight: 1556,
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.35,
    mobileScrollSupport: false,
    flippingTime: 700
  });

  pageFlip.loadFromImages(pages);

  var counter = document.getElementById("counter");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function update() {
    var current = pageFlip.getCurrentPageIndex() + 1;
    counter.textContent = current + " / " + PAGE_COUNT;
    prevBtn.disabled = current <= 1;
    nextBtn.disabled = current >= PAGE_COUNT;
  }

  pageFlip.on("init", function () {
    document.getElementById("loading").style.display = "none";
    update();
  });
  pageFlip.on("flip", update);

  prevBtn.addEventListener("click", function () { pageFlip.flipPrev(); });
  nextBtn.addEventListener("click", function () { pageFlip.flipNext(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") pageFlip.flipPrev();
    if (e.key === "ArrowRight") pageFlip.flipNext();
  });

  document.getElementById("fs").addEventListener("click", function () {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (el.requestFullscreen) {
      el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  });

  window.addEventListener("resize", function () {
    pageFlip.update();
  });
})();
</script>
</body>
</html>
